name: CI

on:
  push:
    branches: [main, "repair/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q

  embedded-integration:
    # Real FalkorDB engine via falkordblite (no docker-in-docker needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,embedded]"
      - run: pytest tests/integration/test_vertical_slice.py tests/integration/test_fault_injection.py tests/integration/test_arivoo_integration.py tests/contract -q
      - run: pytest tests/security -q
      # Host-level CLI flows + admin API run against a real uvicorn server
      # on the runner (the Compose-level variants run on the owner host via
      # scripts/host_acceptance.sh).
      - run: pytest tests/integration/test_host_cli.py -q
      # Extraction eval with the deterministic fake provider (repair §5):
      # proves the labelled set flows through the real pipeline in CI; the
      # real-provider runbook stays in docs/EVAL.md.
      - run: pytest tests/integration/test_extraction_eval.py -q

  postgres-integration:
    # Real PostgreSQL via pgserver; exercises migrations, atomic submit,
    # SKIP LOCKED claiming, and the production control-plane path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/test_postgres.py -q

  docker-build:
    # The production image must build and pass its self-check (review P0:
    # asyncpg runtime dep + migrations present inside the image).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: ecosystem-kb:ci
          load: true
      - name: Run the image self-check directly
        run: docker run --rm ecosystem-kb:ci python -c "import asyncpg, ecosystem_kb.adapters.postgres.migrations as m; assert m.load_migrations(), 'migrations missing'"
