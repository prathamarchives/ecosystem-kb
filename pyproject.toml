[project]
name = "ecosystem-kb"
version = "0.1.0"
description = "Ecosystem knowledge infrastructure: shared source-of-truth KB (Graphiti Core + FalkorDB + PostgreSQL control plane + authenticated REST/MCP gateway)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "graphiti-core==0.31.2",
    "falkordb>=1.8.2",
    "fastmcp==4.2.1",
    "fastapi>=0.129",
    "uvicorn>=0.37",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.21",
    "pydantic>=2.11",
    "pydantic-settings>=2.12",
    "httpx>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.7",
    "asyncpg>=0.30",
]
embedded = [
    # falkordblite provides redis-server + falkordb.so for embedded testing
    "falkordblite>=0.11",
]

[project.scripts]
kb = "ecosystem_kb.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecosystem_kb", "ontology", "contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "embedded: tests that boot an embedded FalkorDB server (need falkordblite)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "ontology", "contracts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
